name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCV and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopencv-dev cmake g++

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Build (Release, warnings as errors)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Benchmark (informative)
        run: |
          mkdir -p reports
          python tools/synth.py --out data/bench --frames 30 >/dev/null
          ./build/sve_cli --input data/bench/smoke_glare/degraded --repeat 4 --report reports/benchmark.json

      - name: Run verification tests
        run: |
          python -m pytest --junitxml=reports/junit.xml \
            --html=reports/test-report.html --self-contained-html

      - name: Traceability matrix
        if: always()
        run: |
          python tools/trace_report.py --junit reports/junit.xml --out reports/traceability.md \
            --title "Verification report (${GITHUB_SHA::7})"
          cat reports/traceability.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: reports/
          retention-days: 90
